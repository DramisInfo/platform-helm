# ClusterRole + ClusterRoleBinding for the operator.
# Owner over Tunnel, TunnelDNSRecord, CloudflareTunnel CRDs and their finalizers.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: cloudflare-operator
rules:
  - apiGroups: [""]
    resources: ["events", "namespaces", "secrets", "services", "configmaps"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["networking.cloudflare-operator.dev"]
    resources: ["tunnels", "tunneldnsrecords", "cloudflaretunnels"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["networking.cloudflare-operator.dev"]
    resources:
      - "tunnels/finalizers"
      - "tunneldnsrecords/finalizers"
      - "cloudflaretunnels/finalizers"
    verbs: ["update"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: cloudflare-operator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cloudflare-operator
subjects:
  - kind: ServiceAccount
    name: cloudflare-operator
    namespace: {{ .Values.namespace }}
