{{- if .Values.bootstrap.argoEvents.enabled -}}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argo-events
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    argocd.argoproj.io/sync-wave: "-90"
spec:
  destination:
    namespace: argo-events
    server: "https://kubernetes.default.svc"
  project: platform-foundations
  source:
    repoURL: "https://argoproj.github.io/argo-helm"
    targetRevision: "2.4.24"
    chart: argo-events
    helm:
      valuesObject:
        # Security context to comply with Gatekeeper psp-pods-must-run-as-nonroot policy
        controller:
          # AB-PR90-fix: force replicas: 2 to skip the chart's
          # "strategy: Recreate" branch (chart adds Recreate strategy only when
          # replicas == 1, which conflicts with the existing RollingUpdate
          # strategy on this Deployment). With 2 replicas, the strategy block
          # is not rendered, leader-election is enabled (single-leader pattern).
          # Trade-off: changes HA model from 1-replica no-leader to 2-replica
          # leader-elected. Acceptable for a control-plane component.
          replicas: 2
          podSecurityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          containerSecurityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
        webhook:
          podSecurityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          containerSecurityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - SkipHooks=true
      - Timeout=600
      - Validate=false
      - Wait=true
      - PruneEmpty=true
    {{- include "platform-core.defaultRetry" . | nindent 4 }}
{{- end -}}
