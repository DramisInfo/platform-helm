{{- if .Values.bootstrap.cloudflareOperator.enabled }}
# ExternalSecret: sync the Cloudflare API token from AKV
# (akv-dramisinfo-shared / cloudflare-api-token) into a Kubernetes Secret
# in the cloudflare-operator-system namespace. The ankra-chart reads
# this Secret via `credentials.existingSecret: cloudflare-secrets`.
#
# Refresh interval: 1h (matches existing ESO ClusterSecretStore convention).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cloudflare-secrets
  namespace: cloudflare-operator-system
  labels:
    app.kubernetes.io/name: cloudflare-operator
    app.kubernetes.io/part-of: platform-core
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: azure-keyvault-shared
  target:
    name: cloudflare-secrets
    creationPolicy: Owner
  data:
    - secretKey: CLOUDFLARE_API_TOKEN
      remoteRef:
        key: cloudflare-api-token
    # CLOUDFLARE_ACCOUNT_ID is intentionally not synced from AKV —
    # it isn't a secret, just a stable identifier. We inject it via a
    # ConfigMap below so the chart can pick it up via existingSecret's
    # accountIdKey.
{{- end }}
