{{- if and .Values.bootstrap.crossplane.enabled .Values.bootstrap.crossplane.workloadIdentity.enabled (ne .Values.bootstrap.crossplane.workloadIdentity.clientId "") -}}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-crossplane-compositions
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    # Wave -109: runs after crossplane-config (-111) is Healthy so all provider
    # CRDs and functions are installed and their CRDs are registered.
    argocd.argoproj.io/sync-wave: "-109"
spec:
  destination:
    namespace: crossplane-system
    server: "https://kubernetes.default.svc"
  project: platform-infra
  sources:
    - repoURL: "https://github.com/DramisInfo/platform-crossplane-compositions.git"
      targetRevision: HEAD
      path: .
      directory:
        recurse: true
        # Whitelist k8s manifests only. Without this, the directory generator
        # mis-parses .release-please-manifest.json (valid JSON, no Kind) and
        # the App has been stuck in ComparisonError since 2026-08-03.
        include: '{compositions/**,*.yaml,*.yml}'
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - SkipDryRunOnMissingResource=true
      - Validate=false
      - Wait=true
      - PruneEmpty=true
    {{- include "platform-core.extendedRetry" . | nindent 4 }}
  ignoreDifferences:
    - group: external-secrets.io
      kind: ExternalSecret
      jqPathExpressions:
        - '.spec.data[].remoteRef.conversionStrategy'
        - '.spec.data[].remoteRef.decodingStrategy'
        - '.spec.data[].remoteRef.metadataPolicy'
{{- end }}
